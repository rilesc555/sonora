name: fork upstream sync

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: fork-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'rilesc555/sonora' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - name: propose the latest official stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release=$(bash scripts/fork-latest-release.sh)
          tag=$(jq -r .tag <<< "$release")
          upstream=$(jq -r .commit <<< "$release")
          if git merge-base --is-ancestor "$upstream" HEAD; then
            echo "The fork already contains official stable release $tag."
            exit 0
          fi
          branch="sync/release-$tag-${upstream:0:12}"
          # Retry this exact release, never a development-head PR left from the old policy.
          existing=$(gh pr list --base main --head "$branch" --state open --json number \
            --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            number=$existing
            echo "Retrying checks for stable release $tag in PR #$number."
          else
            # This branch contains only the official tag, not the current development head.
            git push origin "$upstream:refs/heads/$branch"
            url=$(gh pr create --base main --head "$branch" \
              --title "chore: merge official release $tag" \
              --body "$(printf '## Summary\n\n- merge official stable release %s while keeping the fork changes\n- run checks and release builds before automatic merge' "$tag")")
            number=${url##*/}
            echo "$url"
          fi
          [[ "$number" =~ ^[0-9]+$ ]]
          title="check and merge release PR #$number"
          active=$(gh run list --workflow fork-package.yml --event workflow_dispatch --limit 100 \
            --json databaseId,displayTitle,status \
            --jq ".[] | select(.displayTitle == \"$title\" and .status != \"completed\") | .databaseId")
          if [[ -n "$active" ]]; then
            echo "Checks for PR #$number are already queued or running."
            exit 0
          fi
          # Dispatch trusted main explicitly. Bot PR events can need approval and must not be
          # the only path to checks and automatic merge.
          gh workflow run fork-package.yml --ref main -f "pull_request=$number"
